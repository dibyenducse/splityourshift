# Builds the site and uploads it to Hostinger (splityourshift.com) over FTP on every push to main.
# Needs secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (see SETUP.md → "Hostinger").
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check settings
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "Hostinger FTP secrets are not set yet; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.skip != 'true'
      - run: npm test
        if: steps.check.outputs.skip != 'true'
      - run: npm run build
        if: steps.check.outputs.skip != 'true'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - name: Upload to Hostinger
        if: steps.check.outputs.skip != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftp' }}
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_DIR || 'public_html/' }}
