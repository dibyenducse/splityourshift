# Sets up the Supabase backend: database tables + rules, Edge Functions, login links and email sending.
# Run it from GitHub → Actions → "Set up database" → Run workflow (after adding the secrets in SETUP.md).
name: Set up database

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/**']

jobs:
  supabase:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Check settings
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD secrets and the SUPABASE_PROJECT_REF variable (see SETUP.md)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.20.5
      - run: supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Create or update tables
        run: |
          # The reminder schedule needs this project's address.
          sed -i "s/__PROJECT_REF__/$PROJECT_REF/g" supabase/migrations/*.sql
          supabase db push --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy functions
        run: supabase functions deploy invite-worker phone-login send-reminders --project-ref "$PROJECT_REF"
      - name: Push notification keys (created once, never shown)
        run: |
          if supabase secrets list --project-ref "$PROJECT_REF" | grep -q VAPID_PRIVATE_KEY; then
            echo "Push keys already set."
          else
            KEYS=$(npx --yes web-push@3.6.7 generate-vapid-keys --json)
            PRIV=$(echo "$KEYS" | jq -r .privateKey); PUB=$(echo "$KEYS" | jq -r .publicKey)
            echo "::add-mask::$PRIV"
            supabase secrets set VAPID_PUBLIC_KEY="$PUB" VAPID_PRIVATE_KEY="$PRIV" \
              VAPID_SUBJECT="${{ vars.SITE_URL || 'https://splityourshift.com/' }}" --project-ref "$PROJECT_REF"
          fi
      - name: Tell the functions where the site lives
        run: supabase secrets set SITE_URL="${{ vars.SITE_URL || 'https://splityourshift.com/' }}" --project-ref "$PROJECT_REF"
      - name: Login links, email sender and email templates
        env:
          SITE: ${{ vars.SITE_URL || 'https://splityourshift.com/' }}
          PAGES: ${{ format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: ${{ vars.SMTP_USER || 'noreply@splityourshift.com' }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.hostinger.com' }}
        run: |
          patch() { # $1 = what, $2 = JSON body
            code=$(curl -sS -o resp.json -w '%{http_code}' -X PATCH \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d "$2")
            if [ "$code" -ge 300 ]; then echo "::error::$1: Supabase said $code $(head -c 400 resp.json)"; exit 1; fi
            echo "$1: done"
          }
          # Site URL + allowed redirect links, so invite and reset links open the right site.
          patch "Login links" "$(jq -n --arg site "$SITE" --arg pages "$PAGES" \
            '{site_url: $site, uri_allow_list: ([$site + "**", $pages + "**"] | unique | join(","))}')"
          # Send email from our own mailbox (e.g. Hostinger) instead of Supabase's limited test sender.
          if [ -n "$SMTP_PASSWORD" ]; then
            patch "Email sender" "$(jq -n --arg host "$SMTP_HOST" --arg user "$SMTP_USER" --arg pass "$SMTP_PASSWORD" \
              '{smtp_host: $host, smtp_port: "465", smtp_user: $user, smtp_pass: $pass,
                    smtp_admin_email: $user, smtp_sender_name: "SplitYourShift", rate_limit_email_sent: 100}')"
            # Supabase only allows custom email designs once our own sender is set.
            patch "Email templates" "$(jq -n \
              --rawfile invite supabase/templates/invite.html \
              --rawfile recovery supabase/templates/recovery.html \
              --rawfile confirm supabase/templates/confirmation.html \
              --rawfile magic supabase/templates/magic_link.html \
              --rawfile change supabase/templates/email_change.html \
              --rawfile reauth supabase/templates/reauthentication.html '{
                mailer_subjects_invite: "You are invited to SplitYourShift",
                mailer_templates_invite_content: $invite,
                mailer_subjects_recovery: "Reset your SplitYourShift password",
                mailer_templates_recovery_content: $recovery,
                mailer_subjects_confirmation: "Confirm your SplitYourShift email",
                mailer_templates_confirmation_content: $confirm,
                mailer_subjects_magic_link: "Your SplitYourShift login link",
                mailer_templates_magic_link_content: $magic,
                mailer_subjects_email_change: "Confirm your new SplitYourShift email",
                mailer_templates_email_change_content: $change,
                mailer_subjects_reauthentication: "Your SplitYourShift confirmation code",
                mailer_templates_reauthentication_content: $reauth
              }')"
          else
            echo "::warning::SMTP_PASSWORD secret not set: emails still go through Supabase's limited sender."
          fi
